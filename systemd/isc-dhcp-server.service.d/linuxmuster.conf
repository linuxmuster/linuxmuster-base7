# Shipped by linuxmuster-base7.
#
# isc-dhcp-server is started at boot before the static server address is
# configured, so dhcpd exits with "Not configured to listen on any
# interfaces!" and stays down. network-online.target is reached too early:
# netplan's generator only enables systemd-networkd-wait-online.service if
# it finds the interface when it runs, which at boot is still eth0 (udev
# renames it to enp1s0 later), so the service is skipped by its
# ConditionPathIsSymbolicLink. Retry until the interface is up.
[Service]
Restart=on-failure
RestartSec=5
