# Shipped by linuxmuster-base7.
#
# isc-dhcp-server is started at boot before the static server address is
# configured (network-online.target is reached early, as
# systemd-networkd-wait-online does not wait for the interface to be
# renamed and configured), so dhcpd exits with "Not configured to listen on
# any interfaces!" and stays down. Retry until the interface is up.
[Service]
Restart=on-failure
RestartSec=5
