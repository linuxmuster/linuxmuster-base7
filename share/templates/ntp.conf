# /etc/ntpsec/ntp.conf
#
# Filename     : ntp.conf
# Description  : ntpsec configuration template; see ntp.conf(5) for help
# Signed-off by: thomas@linuxmuster.net
# Assisted by  : Claude
# Date         : 20260818
#

driftfile /var/lib/ntpsec/ntp.drift
statistics loopstats peerstats clockstats
filegen loopstats file loopstats type day enable
filegen peerstats file peerstats type day enable
filegen clockstats file clockstats type day enable
server @@firewallip@@ iburst prefer
restrict -4 default kod nomodify noquery limited mssntp
restrict -6 default kod nomodify noquery limited mssntp
@@restricted_subnets@@
restrict 127.0.0.1
restrict ::1
restrict source nomodify noquery
ntpsigndsocket @@ntpsockdir@@
